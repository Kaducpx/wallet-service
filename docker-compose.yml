# Ambiente local completo.
#
#   docker compose up --build                 # 1 instância (porta 8081)
#   docker compose --profile multi up --build # 3 instâncias (8081, 8082, 8083)
#
# Valores padrão são apenas para uso local (ver .env.example).
name: wallet-service

x-app-env: &app-env
  DATABASE_URL: postgres://wallet_app:${POSTGRES_APP_PASSWORD:-wallet_app_local}@postgres:5432/wallet?sslmode=disable
  OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8080}/realms/wallet
  OIDC_JWKS_URL: http://keycloak:8080/realms/wallet/protocol/openid-connect/certs
  OIDC_AUDIENCE: wallet-service
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
  HTTP_ADDR: ":8081"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SHUTDOWN_TIMEOUT: 25s

x-app: &app
  build: .
  restart: unless-stopped
  stop_grace_period: 30s
  depends_on:
    migrate:
      condition: service_completed_successfully
    keycloak:
      condition: service_healthy
    localstack:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:8081/health/ready"]
    interval: 5s
    timeout: 3s
    retries: 20

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallet_owner_local}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-wallet_app_local}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Checa pela rede (TCP): durante a criação inicial do banco o Postgres
      # sobe um servidor temporário que só aceita conexão local; assim o
      # healthcheck só passa quando o servidor definitivo estiver no ar.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U wallet_owner -d wallet"]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Issuer fixo: tokens obtidos de fora (localhost) ou de dentro da rede
      # (keycloak:8080) carregam o mesmo iss.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 40

  localstack:
    # Versão fixada: funciona sem auth token.
    image: localstack/localstack:4.9
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - ./deploy/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wallet-events.fifo >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 40

  # Aplica as migrations com o dono do schema e termina.
  migrate:
    build: .
    command: ["migrate", "up"]
    environment:
      MIGRATIONS_DATABASE_URL: postgres://wallet_owner:${POSTGRES_PASSWORD:-wallet_owner_local}@postgres:5432/wallet?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app-1
    ports:
      - "8081:8081"

  app-2:
    <<: *app
    profiles: ["multi"]
    environment:
      <<: *app-env
      INSTANCE_ID: app-2
    ports:
      - "8082:8081"

  app-3:
    <<: *app
    profiles: ["multi"]
    environment:
      <<: *app-env
      INSTANCE_ID: app-3
    ports:
      - "8083:8081"

volumes:
  pgdata:
